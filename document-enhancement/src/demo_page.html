<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nâng chất lượng ảnh tài liệu</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
    --accent: #1f6f5c; --accent-ink: #ffffff; --warn: #a3402a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #201f1e; --ink: #ecebe7; --muted: #a09e98; --line: #34332f;
            --accent: #5fb89f; --accent-ink: #0e1a16; --warn: #e48a72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 24px 8px; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 1280px; margin: 0 auto; padding: 12px 24px 40px;
         display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; } header { padding: 16px 16px 4px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .controls { display: flex; flex-direction: column; gap: 16px; align-self: start; }
  label.title { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: var(--muted);
                text-transform: uppercase; letter-spacing: .04em; }
  #drop { border: 2px dashed var(--line); border-radius: 8px; padding: 18px 12px; text-align: center;
          cursor: pointer; color: var(--muted); transition: border-color .15s, background .15s; }
  #drop.over, #drop:hover { border-color: var(--accent); color: var(--ink); }
  #drop strong { color: var(--ink); }
  select, button { font: inherit; width: 100%; padding: 8px 10px; border-radius: 6px;
                   border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
                   font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  .samples { display: flex; flex-direction: column; gap: 6px; }
  .samples button { text-align: left; cursor: pointer; font-size: 14px; }
  .samples button:hover { border-color: var(--accent); }
  .stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .tabs button { width: auto; border: 0; border-radius: 0; padding: 6px 12px; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); }
  #info { color: var(--muted); font-size: 14px; }
  #info b { color: var(--ink); font-weight: 600; }
  .view { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
          min-height: 360px; display: flex; align-items: center; justify-content: center; }
  .empty { color: var(--muted); text-align: center; padding: 40px 12px; }
  /* chế độ kéo so sánh */
  .cmp { position: relative; display: inline-block; max-width: 100%; user-select: none; touch-action: none; cursor: ew-resize; }
  .cmp img { display: block; max-width: 100%; max-height: 78vh; height: auto; }
  .cmp .after { position: absolute; inset: 0; clip-path: inset(0 0 0 50%); }
  .cmp .after img { width: 100%; height: 100%; max-height: none; }
  .cmp .handle { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--accent);
                 transform: translateX(-1px); pointer-events: none; }
  .cmp .handle::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                        background: var(--accent); color: var(--accent-ink); border-radius: 50%;
                        width: 30px; height: 30px; display: grid; place-items: center; font-size: 15px; }
  .tag { position: absolute; top: 8px; padding: 2px 8px; border-radius: 4px; font-size: 12px;
         background: rgba(0,0,0,.6); color: #fff; pointer-events: none; }
  .tag.l { left: 8px; } .tag.r { right: 8px; }
  /* chế độ cạnh nhau */
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  @media (max-width: 600px) { .side { grid-template-columns: 1fr; } }
  .side figure { margin: 0; min-width: 0; }
  .side img { width: 100%; height: auto; display: block; border-radius: 4px; }
  .side figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .err { color: var(--warn); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.dl { color: var(--accent); font-weight: 600; text-decoration: none; }
  .note { font-size: 13px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Nâng chất lượng ảnh tài liệu</h1>
  <p>Khử bóng, chỉnh ánh sáng và màu, giảm nhiễu cho ảnh chụp tài liệu. Ảnh chỉ được xử lý trên máy chạy demo.</p>
</header>
<main>
  <section class="controls panel">
    <div>
      <label class="title">Ảnh vào</label>
      <div id="drop" tabindex="0"><strong>Kéo thả ảnh</strong> vào đây<br>hoặc bấm để chọn tệp</div>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <div>
      <label class="title" for="method">Phương pháp</label>
      <select id="method"></select>
    </div>
    <div>
      <label class="title" for="dewarp">Làm phẳng</label>
      <select id="dewarp"></select>
    </div>
    <div>
      <label class="title" for="size">Kích thước xử lý</label>
      <select id="size">
        <option value="1024" selected>Cạnh dài 1024 px (như lúc chấm)</option>
        <option value="768">Cạnh dài 768 px (nhanh)</option>
        <option value="1600">Cạnh dài 1600 px</option>
        <option value="0">Giữ nguyên (tối đa 3000 px)</option>
      </select>
    </div>
    <button id="run" class="primary" disabled>Xử lý ảnh</button>
    <div>
      <label class="title">Ảnh mẫu</label>
      <div class="samples" id="samples"></div>
    </div>
    <p class="note" id="device"></p>
  </section>

  <section class="stage">
    <div class="bar">
      <div class="tabs" role="tablist">
        <button data-mode="slide" class="on">Kéo so sánh</button>
        <button data-mode="side">Cạnh nhau</button>
      </div>
      <div id="info"></div>
    </div>
    <div class="view" id="view"><div class="empty">Chọn một ảnh mẫu hoặc tải ảnh của bạn lên.</div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let blob = null, result = null, mode = "slide";
try { mode = localStorage.getItem("pbl6-mode") || "slide"; } catch (e) {}

fetch("/api/options").then(r => r.json()).then(o => {
  $("#method").innerHTML = o.methods.map(m =>
    `<option value="${m.key}" ${m.ready ? "" : "disabled"}>${m.label}${m.ready ? "" : " — thiếu checkpoint"}</option>`).join("");
  $("#dewarp").innerHTML = o.dewarp.map(d => `<option value="${d.key}">${d.label}</option>`).join("");
  $("#samples").innerHTML = o.samples.map(s => `<button data-k="${s.key}">${s.label}</button>`).join("");
  $("#device").textContent = "Đang chạy trên " + (o.device === "cuda" ? "GPU" : "CPU") + ".";
  $("#samples").onclick = async e => {
    const k = e.target.closest("button")?.dataset.k; if (!k) return;
    setBlob(await (await fetch("/api/sample/" + k)).blob(), e.target.textContent);
    run();
  };
});

function setBlob(b, name) {
  blob = b; result = null; $("#run").disabled = false;
  $("#info").textContent = name ? "Ảnh: " + name : "";
  const url = URL.createObjectURL(b);
  $("#view").innerHTML = `<div class="side" style="grid-template-columns:1fr"><figure><img src="${url}" alt="ảnh vào"><figcaption>Ảnh vào — bấm “Xử lý ảnh”.</figcaption></figure></div>`;
}

const drop = $("#drop"), file = $("#file");
drop.onclick = () => file.click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") file.click(); };
file.onchange = () => file.files[0] && setBlob(file.files[0], file.files[0].name);
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) setBlob(f, f.name); });
document.addEventListener("paste", e => {
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/")); if (f) setBlob(f, "ảnh dán");
});

$("#run").onclick = run;
$("#method").onchange = () => blob && run();
$("#size").onchange = () => blob && run();
$("#dewarp").onchange = () => blob && run();

async function run() {
  if (!blob) return;
  $("#run").disabled = true;
  $("#view").innerHTML = `<div class="empty"><div class="spinner"></div>Đang xử lý… (CPU mất khoảng 1–5 giây)</div>`;
  if (matchMedia("(max-width: 860px)").matches) $(".stage").scrollIntoView({ behavior: "smooth", block: "start" });
  try {
    const q = new URLSearchParams({ method: $("#method").value, long_side: $("#size").value, dewarp: $("#dewarp").value });
    const r = await fetch("/api/enhance?" + q, { method: "POST", body: blob });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    result = j; render();
  } catch (err) {
    $("#view").innerHTML = `<div class="empty err">Lỗi: ${err.message}</div>`;
  } finally { $("#run").disabled = false; }
}

document.querySelectorAll(".tabs button").forEach(b => {
  b.classList.toggle("on", b.dataset.mode === mode);
  b.onclick = () => {
    mode = b.dataset.mode; try { localStorage.setItem("pbl6-mode", mode); } catch (e) {}
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    if (result) render();
  };
});

function render() {
  const j = result;
  const dw = j.page_found === false ? " · <span class=\"err\">không tìm thấy mép trang</span>" : "";
  $("#info").innerHTML = `<b>${j.method}</b>${j.seconds_dewarp > 0.005 ? " + làm phẳng " + j.seconds_dewarp + " s" : ""}${dw} · ${j.size} px${j.size !== j.orig_size ? " (gốc " + j.orig_size + ")" : ""} · <b>${j.seconds} s</b> · <a class="dl" href="${j.output}" download="anh_da_xu_ly.png">Tải ảnh ra</a>`;
  if (mode === "side" || j.geometry_changed) {
    $("#view").innerHTML = `<div class="side"><figure><img src="${j.input}" alt="trước"><figcaption>Trước</figcaption></figure>
      <figure><img src="${j.output}" alt="sau"><figcaption>Sau${j.geometry_changed ? " (đã làm phẳng: " + j.dewarp + ")" : ""}</figcaption></figure></div>`;
    return;
  }
  $("#view").innerHTML = `<div class="cmp" id="cmp"><img src="${j.input}" alt="trước">
    <div class="after"><img src="${j.output}" alt="sau"></div><div class="handle"></div>
    <span class="tag l">Trước</span><span class="tag r">Sau</span></div>`;
  const c = $("#cmp"), after = c.querySelector(".after"), h = c.querySelector(".handle");
  const set = x => { const r = c.getBoundingClientRect(); const p = Math.min(100, Math.max(0, (x - r.left) / r.width * 100));
    after.style.clipPath = `inset(0 0 0 ${p}%)`; h.style.left = p + "%"; };
  let down = false;
  c.onpointerdown = e => { down = true; c.setPointerCapture(e.pointerId); set(e.clientX); };
  c.onpointermove = e => down && set(e.clientX);
  c.onpointerup = () => down = false;
}
</script>
</body>
</html>
